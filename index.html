<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Araç Arıza Rehberi</title>
<style>
  :root{
    --bg:#0a0d14;
    --panel:#11151f;
    --panel2:#151a26;
    --border:#232938;
    --text:#e8eaf0;
    --muted:#8b93a7;
    --serif:'Georgia','Times New Roman',serif;
    --mono:'SF Mono','Courier New',monospace;
    --blue:#3fa9f5;
    --blue-dim:#1c3a52;
    --amber:#f0a742;
    --amber-dim:#4a3a1c;
    --red:#f2545b;
    --red-dim:#4a1e21;
    --teal:#4fd1a5;
    --teal-dim:#1c4a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--serif);
    padding-bottom:40px;
  }
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 16px 14px;
    background:linear-gradient(180deg,#0d1119,#0a0d14);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:5;
  }
  .app-icon{
    width:42px;height:42px;flex:none;
    border:2px solid var(--blue);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    color:var(--blue);
    background:var(--blue-dim);
  }
  .htitle{flex:1;min-width:0;}
  .htitle h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2px;
  }
  .offline{
    margin-top:2px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1px;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .offline svg{width:13px;height:13px;flex:none;}

  .search-wrap{padding:14px 16px 8px;}
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    transition:border-color .15s;
  }
  .search-box.focused{border-color:var(--amber);}
  .search-box svg{width:18px;height:18px;flex:none;color:var(--muted);}
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:16px;
    letter-spacing:.5px;
  }
  .search-box input::placeholder{color:#57607a;}
  .clear-btn{
    background:none;border:none;color:var(--muted);
    font-size:18px;line-height:1;cursor:pointer;padding:2px 4px;
    display:none;
  }

  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:14px 16px 8px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:1.5px;
    color:var(--muted);
  }
  .section-head b{color:#aab2c5;font-weight:600;}

  #detail{padding:0 16px;}
  .detail-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--blue);
    border-radius:12px;
    padding:18px 16px;
    margin-bottom:14px;
  }
  .detail-card.kritik{border-left-color:var(--red);}
  .detail-card.riskli{border-left-color:var(--amber);}
  .detail-card.sigorta{border-left-color:var(--blue);}
  .detail-card.bilgi{border-left-color:var(--teal);}

  .detail-top{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--muted);
    margin-bottom:10px;
  }
  .badge{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.5px;
    padding:5px 10px;
    border-radius:20px;
    display:inline-flex;align-items:center;gap:5px;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .badge.kritik{color:var(--red);background:var(--red-dim);border-color:#6b2a2f;}
  .badge.riskli{color:var(--amber);background:var(--amber-dim);border-color:#6b5427;}
  .badge.sigorta{color:var(--blue);background:var(--blue-dim);border-color:#2a5876;}
  .badge.bilgi{color:var(--teal);background:var(--teal-dim);border-color:#2a6b52;}

  .detail-title{font-size:26px;font-weight:700;margin:2px 0 6px;line-height:1.25;}
  .detail-cat{
    font-family:var(--mono);font-size:11.5px;letter-spacing:1.2px;color:var(--muted);
    margin-bottom:14px;
  }

  .box{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
  }
  .box-label{
    font-family:var(--mono);font-size:11.5px;letter-spacing:1px;color:var(--muted);
    display:flex;align-items:center;gap:6px;margin-bottom:8px;
  }
  .box-action{color:var(--blue);font-size:16.5px;line-height:1.5;}
  .box-fail{
    border:1px dashed #3a3f52;
    border-radius:10px;
    padding:14px;
  }
  .box-fail .box-label{color:var(--amber);}
  .box-fail p{color:var(--amber);font-size:15px;line-height:1.6;margin:0;opacity:.92;}

  video{
    width:100%;
    border-radius:10px;
    margin-top:4px;
    background:#000;
    display:block;
  }
  .video-wrap{margin-bottom:12px;}

  #matches{padding:0 16px;}
  .list{display:flex;flex-direction:column;gap:10px;}
  .item{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
  }
  .item:active{background:var(--panel2);}
  .item-top{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.kritik{background:var(--red);}
  .dot.riskli{background:var(--amber);}
  .dot.sigorta{background:var(--blue);}
  .dot.bilgi{background:var(--teal);}
  .item-code{font-size:18px;font-weight:700;}
  .item-badge{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;color:var(--muted);
    text-transform:uppercase;
  }
  .item-name{font-size:16px;color:#dcdfe8;}

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.6px;
    color:#4d5468;
    padding:26px 16px 10px;
    line-height:1.6;
  }
  .empty{
    text-align:center;color:var(--muted);
    font-family:var(--mono);font-size:13px;
    padding:30px 16px;
  }
</style>
</head>

const VIDEOS = { "65": "videos/%20Dddd%20MP4.mp4" };
const SEV_LABEL = { kritik:"KRİTİK", riskli:"RİSKLİ", sigorta:"SİGORTA/TRİP", bilgi:"BİLGİ" };
const SEV_ICON  = { kritik:"⛔", riskli:"⚠", sigorta:"🔧", bilgi:"ⓘ" };

const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const searchEl = document.getElementById('search');
const searchBox = document.getElementById('searchBox');
const clearBtn = document.getElementById('clearBtn');
const sectionTitle = document.getElementById('sectionTitle');
const sectionCount = document.getElementById('sectionCount');

function escapeHtml(s){
  return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderList(items){
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty">Eşleşen arıza bulunamadı.</div>';
    return;
  }
  listEl.innerHTML = items.map(f => `
    <div class="item" data-code="${f.code}">
      <div class="item-top">
        <span class="dot ${f.severity}"></span>
        <span class="item-code">${f.codeLabel}</span>
        <span class="item-badge">${SEV_LABEL[f.severity]}</span>
      </div>
      <div class="item-name">${escapeHtml(f.name)}</div>
    </div>
  `).join('');
  listEl.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      searchEl.value = el.getAttribute('data-code');
      runSearch();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function renderDetail(f){
  const vid = VIDEOS[f.code];
  detailEl.innerHTML = `
    <div class="detail-card ${f.severity}">
      <div class="detail-top">
        <span>ARIZA NO ${f.codeLabel}</span>
        <span class="badge ${f.severity}">${SEV_ICON[f.severity]} ${SEV_LABEL[f.severity]}</span>
      </div>
      <div class="detail-title">${escapeHtml(f.name)}</div>
      <div class="detail-cat">${escapeHtml(f.category)}</div>
      ${vid ? `<div class="video-wrap"><video controls playsinline preload="metadata" src="${vid}"></video></div>` : ""}
      <div class="box">
        <div class="box-label">🔧 YAPILACAK İŞLEM</div>
        <div class="box-action">${escapeHtml(f.action) || "—"}</div>
      </div>
      ${f.fail ? `
      <div class="box-fail">
        <div class="box-label">▸ GEÇMEZSE / EK BİLGİ</div>
        <p>${escapeHtml(f.fail)}</p>
      </div>` : ""}
    </div>
  `;
}

    detailEl.innerHTML = "";
    sectionTitle.textContent = "TÜM ARIZA LİSTESİ";
    sectionCount.textContent = FAULTS.length + " kayıt";
    renderList(FAULTS);
    return;
  }

  const exact = FAULTS.find(f => f.code === val);
  const matches = FAULTS.filter(f => f.code === val);

  if(exact){
    renderDetail(exact);
  } else {
    detailEl.innerHTML = "";
  }
  sectionTitle.textContent = "EŞLEŞEN ARIZALAR";
  sectionCount.textContent = matches.length + " kayıt";
  renderList(matches);
}

searchEl.addEventListener('input', runSearch);
searchEl.addEventListener('focus', () => searchBox.classList.add('focused'));
searchEl.addEventListener('blur', () => searchBox.classList.remove('focused'));
clearBtn.addEventListener('click', () => { searchEl.value=""; runSearch(); searchEl.focus(); });

runSearch();
</script>
</body>
</html>
